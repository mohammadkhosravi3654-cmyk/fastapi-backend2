name: Build Khosravi Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-assistant/**"
  issues:
    types: [opened]

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.title, '[BUILD-APK]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khosravi-assistant-debug
          path: android-assistant/app/build/outputs/apk/debug/app-debug.apk
