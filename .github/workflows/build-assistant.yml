name: Build Khosravi Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-assistant/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compatible Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5-bin.zip
          unzip -q gradle-9.5-bin.zip -d "$RUNNER_TEMP"
      - name: Build debug APK
        working-directory: android-assistant
        run: "$RUNNER_TEMP/gradle-9.5/bin/gradle" :app:assembleDebug --no-daemon
      - name: Verify APK
        working-directory: android-assistant
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khosravi-assistant-debug
          path: android-assistant/app/build/outputs/apk/debug/app-debug.apk
